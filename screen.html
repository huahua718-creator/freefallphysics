<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班務大屏 - 運動物理分析專用接收端</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; color: #fff; position: relative; }
    
    #qrcode-view { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
    .pin-code { font-size: 4rem; font-weight: bold; color: #4dabf7; letter-spacing: 5px; margin: 10px 0; }
    #qrcode { background: #fff; padding: 15px; border-radius: 12px; margin: 15px 0; }
    
    #photo-view, #video-container { 
      display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; border: none; background: #000; z-index: 10;
    }
    #photo-view { object-fit: contain; }
    #remote-video { width: 100%; height: 100%; object-fit: contain; }
    .live-badge { position: absolute; top: 20px; left: 20px; background: rgba(255, 59, 48, 0.9); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; z-index: 20; }
    
    #annotation-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99; }
    #reset-btn { position: fixed; bottom: 20px; right: 20px; z-index: 999; background: rgba(0,0,0,0.8); color: white; border: 1px solid #555; padding: 10px 20px; border-radius: 20px; cursor: pointer; display: none; }
    
    /* 大屏控制面板 */
    #physics-control-panel { 
      position: fixed; top: 20px; right: 20px; z-index: 900; background: rgba(28, 28, 30, 0.9); 
      padding: 15px 20px; border-radius: 16px; border: 1px solid #444; width: 340px; backdrop-filter: blur(10px);
    }
    #physics-control-panel h3 { font-size: 1.1rem; margin-bottom: 10px; color: #4dabf7; text-align: center; }
    .mode-select { width: 100%; padding: 8px; background: #2c2c2e; color: #fff; border: 1px solid #555; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
    .start-rec-btn { width: 100%; padding: 12px; background: #34c759; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }

    /* 倒數 Overlay 與背景幕 */
    #countdown-overlay { 
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
      background: #000; z-index: 950; justify-content: center; align-items: center; 
      font-size: 12rem; font-weight: bold; color: #4dabf7; user-select: none;
    }
    #recording-backdrop { 
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
      background: #000; z-index: 940; cursor: pointer;
    }
    #blue-ref-dot { 
      position: absolute; top: 50px; left: 50px; width: 40px; height: 40px; 
      background: #007aff; border-radius: 50%; box-shadow: 0 0 20px #007aff; display: none;
    }
    .recording-hint { position: absolute; bottom: 30px; width: 100%; text-align: center; color: #8e8e93; font-size: 1.2rem; pointer-events: none; }
  </style>
</head>
<body>

  <div id="qrcode-view">
    <h2>運動物理分析助手 (大屏端)</h2>
    <p style="color: #aaa; margin-top: 5px;">連線配對碼</p>
    <div class="pin-code" id="pin-display">------</div>
    <div id="qrcode"></div>
    <p>請用手機掃描 QR Code 進行【運動分析 / 拍照標註】</p>
  </div>

  <img id="photo-view" src="" alt="推送的照片">

  <div id="video-container">
    <div class="live-badge">🔴 實況運動分析傳輸中</div>
    <video id="remote-video" autoplay playsinline muted controls></video>
  </div>

  <!-- 大屏互動控制面板 -->
  <div id="physics-control-panel">
    <h3>⚛️ 物理運動實驗大屏遙控器</h3>
    <select id="screen-mode-select" class="mode-select">
      <option value="bgSub">📐 腳架拍攝（拍攝背景去背）</option>
      <option value="bsBlack">🖥️ 大屏純黑幕模式</option>
      <option value="bsRefPoint">📍 大屏黑幕 + 藍點基準模式</option>
    </select>
    <button class="start-rec-btn" onclick="triggerCountdown()">🎬 開始 3 秒倒數實驗</button>
  </div>

  <div id="countdown-overlay">3</div>

  <div id="recording-backdrop" onclick="stopPhysicsRecording()">
    <div id="blue-ref-dot"></div>
    <div class="recording-hint">🎥 實驗進行中... (點擊大屏任意處結束錄影並產生分析)</div>
  </div>

  <canvas id="annotation-canvas"></canvas>
  <button id="reset-btn" onclick="resetScreen()">結束並返回待機</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

     const firebaseConfig = {
      apiKey: "AIzaSyBl2Mtn9p8iAloAwPkS_4GxfSGZF-pFPGQ",
      authDomain: "physics-free-fall.firebaseapp.com",
      databaseURL: "https://physics-free-fall-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "physics-free-fall"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let screenId = urlParams.get('id') || Math.floor(100000 + Math.random() * 900000).toString();
    window.history.replaceState(null, '', `?id=${screenId}`);

    document.getElementById('pin-display').innerText = screenId;
    const mobileUrl = `${window.location.origin}/mobile.html?id=${screenId}`;
    new QRCode(document.getElementById("qrcode"), { text: mobileUrl, width: 200, height: 200 });

    const canvas = document.getElementById('annotation-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const screenRef = ref(db, 'screens/' + screenId);
    let peerConnection = null;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    onValue(screenRef, async (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      if (data.mode === 'photo' && data.photoUrl) {
        closeWebRTC(); showView('photo');
        document.getElementById('photo-view').src = data.photoUrl;
      } else if (data.mode === 'webrtc' && data.offer) {
        showView('video');
        await handleWebRTCOffer(data.offer);
      } else if (data.mode === 'idle') {
        resetUI();
      }
    });

    window.triggerCountdown = function() {
      const selectedMode = document.getElementById('screen-mode-select').value;
      const countdownOverlay = document.getElementById('countdown-overlay');
      countdownOverlay.style.display = 'flex';
      let count = 3;
      countdownOverlay.innerText = count;

      set(ref(db, `screens/${screenId}/physicsControl`), { state: 'countdown', mode: selectedMode, t: Date.now() });

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownOverlay.innerText = count;
        } else {
          clearInterval(timer);
          countdownOverlay.style.display = 'none';
          startRecordingBackdrop(selectedMode);
        }
      }, 1000);
    };

    function startRecordingBackdrop(mode) {
      const backdrop = document.getElementById('recording-backdrop');
      const blueDot = document.getElementById('blue-ref-dot');
      backdrop.style.display = 'block';
      blueDot.style.display = mode === 'bsRefPoint' ? 'block' : 'none';

      set(ref(db, `screens/${screenId}/physicsControl`), { state: 'recording', mode: mode, t: Date.now() });
    }

    window.stopPhysicsRecording = function() {
      document.getElementById('recording-backdrop').style.display = 'none';
      set(ref(db, `screens/${screenId}/physicsControl`), { state: 'stop', t: Date.now() });
    };

    /* 畫筆標註與 WebRTC */
    const drawEventsRef = ref(db, `screens/${screenId}/drawEvents`);
    onChildAdded(drawEventsRef, (snapshot) => {
      const d = snapshot.val();
      if (d) {
        ctx.beginPath();
        ctx.moveTo(d.x0 * canvas.width, d.y0 * canvas.height);
        ctx.lineTo(d.x1 * canvas.width, d.y1 * canvas.height);
        if (d.isEraser) {
          ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = d.size || 20;
        } else {
          ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = d.color; ctx.lineWidth = d.size || 4;
        }
        ctx.lineCap = 'round'; ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
      }
    });

    onValue(drawEventsRef, (snapshot) => {
      if (!snapshot.exists()) ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    async function handleWebRTCOffer(offer) {
      if (peerConnection) return;
      peerConnection = new RTCPeerConnection(rtcConfig);
      peerConnection.ontrack = (event) => {
        const remoteVideo = document.getElementById('remote-video');
        if (remoteVideo.srcObject !== event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          remoteVideo.play().catch(e => console.log(e));
        }
      };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) push(ref(db, `screens/${screenId}/calleeCandidates`), event.candidate.toJSON());
      };
      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      set(ref(db, `screens/${screenId}/answer`), { type: answer.type, sdp: answer.sdp });

      onChildAdded(ref(db, `screens/${screenId}/callerCandidates`), (snapshot) => {
        if (snapshot.val()) peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
      });
    }

    function closeWebRTC() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      const remoteVideo = document.getElementById('remote-video');
      if (remoteVideo.srcObject) {
        remoteVideo.srcObject.getTracks().forEach(track => track.stop());
        remoteVideo.srcObject = null;
      }
    }

    function showView(type) {
      document.getElementById('qrcode-view').style.display = 'none';
      document.getElementById('photo-view').style.display = type === 'photo' ? 'block' : 'none';
      document.getElementById('video-container').style.display = type === 'video' ? 'block' : 'none';
      document.getElementById('reset-btn').style.display = 'block';
    }

    function resetUI() {
      closeWebRTC(); ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('photo-view').src = "";
      document.getElementById('photo-view').style.display = 'none';
      document.getElementById('video-container').style.display = 'none';
      document.getElementById('qrcode-view').style.display = 'flex';
      document.getElementById('reset-btn').style.display = 'none';
    }

    window.resetScreen = function() {
      remove(screenRef); set(screenRef, { mode: 'idle' }); resetUI();
    };
  </script>
</body>
</html>
